<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luna - Food Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#9B8DE5',
            teal: '#4DB6AC',
            lightGray: '#F7F7F7',
            charcoal: '#333333',
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            lora: ['Lora', 'serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-lightGray font-poppins text-charcoal min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- Header -->
    <div class="flex items-center mb-8">
      <div class="w-10 h-10 rounded-full bg-gradient-to-r from-lavender to-teal flex items-center justify-center text-white mr-3">
        <i class="fas fa-utensils"></i>
      </div>
      <h1 class="text-2xl md:text-3xl font-lora font-bold">Food Tracker</h1>
    </div>

    <!-- Add Meal Form -->
    <div class="bg-white rounded-2xl p-6 shadow-lg mb-8" x-data="mealForm()">
      <h2 class="text-xl font-semibold mb-4">Add a New Meal</h2>
      <form @submit.prevent="submitMeal">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Meal Name</label>
          <input type="text" x-model="meal.name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Time</label>
          <input type="time" x-model="meal.time" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Description</label>
          <textarea x-model="meal.description" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender" rows="2"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-sm font-medium mb-1">Calories (kcal)</label>
            <input type="number" x-model.number="meal.calories" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Glycemic Index</label>
            <select x-model="meal.gi" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender">
              <option>Low GI</option>
              <option>Medium GI</option>
              <option>High GI</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-lavender to-teal text-white rounded-full font-semibold shadow-md hover:shadow-lg">
          Save Meal
        </button>
      </form>
    </div>

    <!-- Meal Log -->
    <div class="bg-white rounded-2xl p-6 shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Today’s Log</h2>
      <template x-if="meals.length === 0">
        <p class="text-charcoal/60 text-center py-6">No meals logged yet.</p>
      </template>
      <div x-show="meals.length > 0" class="space-y-4">
        <template x-for="meal in meals" :key="meal.id">
          <div class="border border-charcoal/10 rounded-xl p-4 flex justify-between items-start">
            <div>
              <h3 class="font-semibold" x-text="meal.name"></h3>
              <p class="text-sm text-charcoal/70" x-text="meal.description || '—'"></p>
              <p class="text-xs text-charcoal/60 mt-1" x-text="`${meal.time} • ${meal.calories} kcal • ${meal.gi}`"></p>
            </div>
            <button @click="deleteMeal(meal.id)" class="text-red-500 hover:text-red-700">
              <i class="fas fa-trash text-sm"></i>
            </button>
          </div>
        </template>
      </div>
    </div>
  </div>

  <script>
    function mealForm() {
      return {
        meal: { name: '', time: '', description: '', calories: null, gi: 'Low GI' },
        meals: [],

        async init() {
          await this.loadMeals();
        },

        async loadMeals() {
          try {
            const res = await fetch('/api/meals/');
            if (res.ok) this.meals = await res.json();
          } catch (e) { console.error(e); }
        },

        async submitMeal() {
          const payload = { ...this.meal, calories: this.meal.calories || 0 };
          try {
            const res = await fetch('/api/meals/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (res.ok) {
              await this.loadMeals();
              this.meal = { name: '', time: '', description: '', calories: null, gi: 'Low GI' };
            }
          } catch (e) { console.error(e); }
        },

        async deleteMeal(id) {
          try {
            const res = await fetch(`/api/meals/${id}/`, { method: 'DELETE' });
            if (res.ok) await this.loadMeals();
          } catch (e) { console.error(e); }
        }
      };
    }
  </script>
</body>
</html>
