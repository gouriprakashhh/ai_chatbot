<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luna - Diet Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lavender: '#9B8DE5',
            teal: '#4DB6AC',
            lightGray: '#F7F7F7',
            charcoal: '#333333',
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            lora: ['Lora', 'serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-lightGray font-poppins text-charcoal min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="flex items-center mb-8">
      <div class="w-10 h-10 rounded-full bg-gradient-to-r from-lavender to-teal flex items-center justify-center text-white mr-3">
        <i class="fas fa-apple-alt"></i>
      </div>
      <h1 class="text-2xl md:text-3xl font-lora font-bold">Diet Goals</h1>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-lg mb-8" x-data="goalForm()">
      <h2 class="text-xl font-semibold mb-4">Add a New Goal</h2>
      <form @submit.prevent="submitGoal">
        <div class="mb-4">
          <input type="text" x-model="goal.text" placeholder="e.g., Reduce added sugar" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-lavender" required />
        </div>
        <button type="submit" class="w-full py-2.5 bg-gradient-to-r from-lavender to-teal text-white rounded-full font-semibold shadow-md hover:shadow-lg">
          Add Goal
        </button>
      </form>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Weekly Goals</h2>
      <template x-if="goals.length === 0">
        <p class="text-charcoal/60 text-center py-6">No goals set yet.</p>
      </template>
      <div x-show="goals.length > 0" class="space-y-3">
        <template x-for="goal in goals" :key="goal.id">
          <div class="flex items-center justify-between p-3 border border-charcoal/10 rounded-xl">
            <div class="flex items-center">
              <button @click="toggleGoal(goal)" class="mr-3 w-5 h-5 rounded-full flex items-center justify-center" :class="goal.completed ? 'bg-teal text-white' : 'border border-charcoal/30'">
                <i class="fas fa-check text-[10px]" x-show="goal.completed"></i>
              </button>
              <span :class="goal.completed ? 'line-through text-charcoal/50' : 'text-charcoal'" x-text="goal.text"></span>
            </div>
            <button @click="deleteGoal(goal.id)" class="text-red-500 hover:text-red-700">
              <i class="fas fa-trash text-sm"></i>
            </button>
          </div>
        </template>
      </div>

      <div class="mt-6 pt-4 border-t border-charcoal/10" x-show="goals.length > 0">
        <div class="flex justify-between text-xs text-charcoal/50 mb-1">
          <span>Weekly Progress</span>
          <span x-text="`${completedCount} / ${goals.length}`"></span>
        </div>
        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-lavender to-teal rounded-full" :style="`width: ${progressPercent}%`"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function goalForm() {
      return {
        goal: { text: '' },
        goals: [],

        async init() {
          await this.loadGoals();
        },

        get completedCount() {
          return this.goals.filter(g => g.completed).length;
        },

        get progressPercent() {
          return this.goals.length ? Math.round((this.completedCount / this.goals.length) * 100) : 0;
        },

        async loadGoals() {
          try {
            const res = await fetch('/api/diet-goals/');
            if (res.ok) this.goals = await res.json();
          } catch (e) { console.error(e); }
        },

        async submitGoal() {
          try {
            const res = await fetch('/api/diet-goals/', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: this.goal.text.trim() })
            });
            if (res.ok) {
              await this.loadGoals();
              this.goal.text = '';
            }
          } catch (e) { console.error(e); }
        },

        async toggleGoal(goal) {
          try {
            const res = await fetch(`/api/diet-goals/${goal.id}/`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ completed: !goal.completed })
            });
            if (res.ok) await this.loadGoals();
          } catch (e) { console.error(e); }
        },

        async deleteGoal(id) {
          try {
            const res = await fetch(`/api/diet-goals/${id}/`, { method: 'DELETE' });
            if (res.ok) await this.loadGoals();
          } catch (e) { console.error(e); }
        }
      };
    }
  </script>
</body>
</html>
