<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up with Custom Validation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Merriweather+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#9B8DE5',
                        secondary: '#4DB6AC',
                        background: '#F7F7F7',
                        charcoal: '#333333'
                    },
                    fontFamily: {
                        'poppins': ['Poppins', 'sans-serif'],
                        'merriweather': ['Merriweather Sans', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'slide-in': 'slideIn 0.8s ease-out forwards',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'bounce-gentle': 'bounceGentle 2s ease-in-out infinite',
                        'pulse-soft': 'pulseSoft 2s ease-in-out infinite',
                        'shake': 'shake 0.5s ease-in-out'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        slideIn: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' }
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
                            '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles to disable default browser validation */
        input:invalid,
        input:required {
            box-shadow: none !important;
            -moz-box-shadow: none !important;
            -webkit-box-shadow: none !important;
            outline: none !important;
        }

        /* Hide the default validation message bubble */
        ::-webkit-validation-bubble-message {
            display: none;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-background via-white to-purple-50 min-h-screen font-poppins">
    <!-- Background Decorations -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-20 left-10 w-32 h-32 bg-primary opacity-10 rounded-full animate-float"></div>
        <div class="absolute top-40 right-20 w-24 h-24 bg-secondary opacity-15 rounded-full animate-bounce-gentle"
            style="animation-delay: 1s;"></div>
        <div class="absolute bottom-20 left-20 w-40 h-40 bg-gradient-to-r from-primary to-secondary opacity-5 rounded-full animate-pulse-soft"
            style="animation-delay: 2s;"></div>
        <div class="absolute bottom-40 right-10 w-20 h-20 bg-primary opacity-10 rounded-full animate-float"
            style="animation-delay: 3s;"></div>
    </div>

    <div class="container mx-auto px-4 py-8 min-h-screen flex items-center justify-center" x-data="signupForm()">
        <!-- Main Signup Card -->
        <div class="w-full max-w-md">
            <!-- Header -->
            <div class="text-center mb-8 animate-fade-in">
                <div
                    class="inline-block p-4 bg-gradient-to-r from-primary to-secondary rounded-full mb-4 animate-bounce-gentle">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-merriweather font-bold text-charcoal mb-2">Create Account</h1>
                <p class="text-gray-600 font-light">Please sign up to create your account</p>
            </div>

            <!-- Signup Form Card -->
            <div class="bg-white rounded-2xl shadow-xl p-8 animate-slide-in transform transition-all duration-500 hover:shadow-2xl"
                :class="{ 'animate-shake': djangoError || hasValidationErrors }">

               <!-- Django Error Message -->
<div x-show="djangoErrorExists"
     x-transition:enter="transition ease-out duration-300"
     x-transition:leave="transition ease-in duration-700 opacity-0"
     class="mb-6 p-4 bg-gradient-to-r from-red-50 to-pink-50 border-l-4 border-red-400 rounded-r-lg"
     x-cloak>
    <div class="flex items-center">
        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd"></path>
        </svg>
        <p class="text-red-700 font-medium" x-text="djangoErrorMessage"></p>
    </div>
</div>

<!-- Client-side / Network Error -->
<div x-show="errorMessage && !djangoErrorExists"
     x-transition:enter="transition ease-out duration-300"
     x-transition:leave="transition ease-in duration-700 opacity-0"
     class="mb-6 p-4 bg-gradient-to-r from-red-50 to-pink-50 border-l-4 border-red-400 rounded-r-lg">
    <div class="flex items-center">
        <svg class="w-5 h-5 text-red-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                clip-rule="evenodd"></path>
        </svg>
        <p class="text-red-700 font-medium" x-text="errorMessage"></p>
    </div>
</div>


                <!-- Django Form -->
                <form method="post" action="/signup/" @submit="handleSubmit" class="space-y-6" novalidate>
                    <!-- CSRF token would go here in a real Django app -->
                    {% csrf_token %}

                    <!-- Username Field -->
                    <div class="group">
                        <label class="block text-sm font-semibold text-charcoal mb-2">
                            Username
                        </label>
                        <div class="relative">
                            <input type="text" name="username" x-model="formData.username"
                                :class="{ 'border-red-400 ring-red-200': errors.username }"
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-3 focus:ring-primary/30 focus:border-primary transition-all duration-300 transform group-hover:scale-[1.02] placeholder-gray-400"
                                placeholder="Enter your username" required @input="clearError('username')">
                            <div
                                class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none opacity-0 group-focus-within:opacity-100 transition-opacity duration-300">
                                <svg class="w-5 h-5 text-primary animate-pulse-soft" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                            </div>
                        </div>
                        <p x-show="errors.username" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 transform -translate-y-1"
                            x-transition:enter-end="opacity-100 transform translate-y-0"
                            class="text-red-500 text-xs mt-1 font-medium" x-text="errors.username"></p>
                    </div>

                    <!-- Email Field -->
                    <div class="group">
                        <label class="block text-sm font-semibold text-charcoal mb-2">
                            Email
                        </label>
                        <div class="relative">
                            <input type="email" name="email" x-model="formData.email"
                                :class="{ 'border-red-400 ring-red-200': errors.email }"
                                class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-3 focus:ring-primary/30 focus:border-primary transition-all duration-300 transform group-hover:scale-[1.02] placeholder-gray-400"
                                placeholder="Enter your email" required @input="clearError('email')">
                            <div
                                class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none opacity-0 group-focus-within:opacity-100 transition-opacity duration-300">
                                <svg class="w-5 h-5 text-primary animate-pulse-soft" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg>
                            </div>
                        </div>
                        <p x-show="errors.email" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 transform -translate-y-1"
                            x-transition:enter-end="opacity-100 transform translate-y-0"
                            class="text-red-500 text-xs mt-1 font-medium" x-text="errors.email"></p>
                    </div>

                    <!-- Password Field -->
                    <div class="group">
                        <label class="block text-sm font-semibold text-charcoal mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <input :type="showPassword ? 'text' : 'password'" name="password"
                                x-model="formData.password" :class="{ 'border-red-400 ring-red-200': errors.password }"
                                class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl focus:outline-none focus:ring-3 focus:ring-primary/30 focus:border-primary transition-all duration-300 transform group-hover:scale-[1.02] placeholder-gray-400"
                                placeholder="Enter your password" autocomplete="new-password" required
                                @input="clearError('password')">
                            <button type="button" @click="showPassword = !showPassword"
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-primary transition-all duration-300 transform hover:scale-110 group">
                                <!-- Hide Password Icon (Lock) -->
                                <div x-show="!showPassword" x-transition:enter="transition ease-out duration-200"
                                    x-transition:enter-start="opacity-0 rotate-90"
                                    x-transition:enter-end="opacity-100 rotate-0" class="relative">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                        </path>
                                    </svg>
                                    <div
                                        class="absolute -top-1 -right-1 w-2 h-2 bg-secondary rounded-full animate-pulse opacity-75">
                                    </div>
                                </div>

                                <!-- Show Password Icon (Unlock) -->
                                <div x-show="showPassword" x-transition:enter="transition ease-out duration-200"
                                    x-transition:enter-start="opacity-0 rotate-90"
                                    x-transition:enter-end="opacity-100 rotate-0" class="relative">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                    <div
                                        class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full animate-bounce-gentle opacity-75">
                                    </div>
                                </div>
                            </button>
                        </div>
                        <p x-show="errors.password" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 transform -translate-y-1"
                            x-transition:enter-end="opacity-100 transform translate-y-0"
                            class="text-red-500 text-xs mt-1 font-medium" x-text="errors.password"></p>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" :disabled="isLoading"
                        class="w-full py-4 bg-gradient-to-r from-primary to-secondary text-white font-semibold rounded-xl shadow-lg transform transition-all duration-300 hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-primary/30 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                        <span x-show="!isLoading" class="flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                </path>
                            </svg>
                            Send OTP
                        </span>
                        <span x-show="isLoading" class="flex items-center justify-center">
                            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                            Sending OTP...
                        </span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center my-8">
                    <div class="flex-1 border-t border-gray-300"></div>
                    <div class="mx-4 text-gray-500 text-sm font-medium">or</div>
                    <div class="flex-1 border-t border-gray-300"></div>
                </div>

                <!-- Google Signup -->
                <a href="/google-signup/"
                    class="w-full flex items-center justify-center px-4 py-3 border-2 border-gray-300 rounded-xl text-charcoal font-semibold hover:border-secondary hover:text-secondary transition-all duration-300 transform hover:scale-105 hover:shadow-md group">
                    <svg class="w-5 h-5 mr-3 group-hover:animate-bounce-gentle" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Sign up with Google
                </a>
            </div>

            <!-- Footer -->
            <div class="text-center mt-8 animate-fade-in" style="animation-delay: 0.5s;">
                <p class="text-gray-600 text-sm">
                    Already have an account?
                    <a href="/login/"
                        class="text-primary hover:text-secondary font-semibold transition-colors duration-300 hover:underline">
                        Login here
                    </a>
                </p>
            </div>
        </div>
    </div>

<script>
    function signupForm() {
        return {
            formData: {
                username: '',
                email: '',
                password: ''
            },
            showPassword: false,
            isLoading: false,

            // Error states
            errorMessage: '',
            errors: {},
            hasValidationErrors: false,

            // Django error state
            djangoErrorMessage: "{{ error|default:'' }}",
            djangoErrorExists: false,

            init() {
                if (this.djangoErrorMessage) {
                    this.showError(this.djangoErrorMessage, true);
                }
            },

            clearError(field) {
                if (this.errors[field]) {
                    this.errors[field] = '';
                    this.hasValidationErrors = false;
                }
            },

            validateForm() {
                this.errors = {};
                this.hasValidationErrors = false;

                // Username
                if (!this.formData.username.trim()) {
                    this.errors.username = 'Username is required';
                    this.hasValidationErrors = true;
                }

                // Email
                if (!this.formData.email.trim()) {
                    this.errors.email = 'Email is required';
                    this.hasValidationErrors = true;
                } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.formData.email)) {
                    this.errors.email = 'Please enter a valid email address';
                    this.hasValidationErrors = true;
                }

                // Password
                if (!this.formData.password.trim()) {
                    this.errors.password = 'Password is required';
                    this.hasValidationErrors = true;
                } else if (this.formData.password.length < 6) {
                    this.errors.password = 'Password must be at least 6 characters';
                    this.hasValidationErrors = true;
                }

                return !this.hasValidationErrors;
            },

            /**
             * Show error (Django or client-side) with auto-hide
             */
            showError(message, isDjango = false) {
                this.errorMessage = '';
                this.djangoErrorExists = false;

                if (isDjango) {
                    this.djangoErrorExists = true;
                    this.djangoErrorMessage = message;
                } else {
                    this.errorMessage = message;
                }

                // Auto-hide after 3 seconds
                setTimeout(() => {
                    this.errorMessage = '';
                    this.djangoErrorExists = false;
                    this.djangoErrorMessage = '';
                }, 3000);
            },

            async handleSubmit(e) {
                e.preventDefault();
                e.stopPropagation();

                this.errorMessage = '';
                this.djangoErrorExists = false;

                if (!this.validateForm()) {
                    return false;
                }

                this.isLoading = true;

                try {
                    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

                    const formData = new FormData();
                    formData.append('username', this.formData.username);
                    formData.append('email', this.formData.email);
                    formData.append('password', this.formData.password);
                    formData.append('csrfmiddlewaretoken', csrfToken);

                    const response = await fetch('/signup/', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest',
                        },
                        credentials: 'same-origin'
                    });

                    if (response.ok) {
                        if (response.redirected) {
                            window.location.href = response.url;
                            return;
                        }

                        const responseText = await response.text();

                        if (responseText.includes('signup') || responseText.includes('error')) {
                            const parser = new DOMParser();
                            const doc = parser.parseFromString(responseText, 'text/html');
                            const errorElement = doc.querySelector('.error');

                            if (errorElement) {
                                this.showError(errorElement.textContent.trim(), true);
                            } else {
                                this.showError('Signup failed. Please try again.');
                            }
                        } else {
                            window.location.reload();
                        }
                    } else {
                        try {
                            const errorData = await response.json();
                            if (errorData && errorData.error) {
                                this.showError(errorData.error, true);
                            } else {
                                this.showError('Signup failed. Please try again.');
                            }
                        } catch {
                            if (response.status === 403) {
                                this.showError('Access denied. Please try again.');
                            } else if (response.status >= 500) {
                                this.showError('Server error. Please try again later.');
                            } else {
                                this.showError('Signup failed. Please try again.');
                            }
                        }
                    }
                } catch (error) {
                    console.error('Signup error:', error);
                    this.showError('Network error. Please check your connection.');
                } finally {
                    this.isLoading = false;
                }

                return false;
            }
        }
    }
</script>


</body>

</html>
