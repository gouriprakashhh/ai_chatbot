<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna - PCOS Mental Health Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Merriweather+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#9B8DE5',
            secondary: '#4DB6AC',
            background: '#F7F7F7',
            charcoal: '#333333'
          },
          fontFamily: {
            'poppins': ['Poppins', 'sans-serif'],
            'nunito': ['Nunito', 'sans-serif'],
            'merriweather': ['Merriweather Sans', 'sans-serif']
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'gradient': 'gradient 3s ease infinite',
            'slideUp': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1)',
            'messageSlide': 'messageSlide 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'messageSlideRight': 'messageSlideRight 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'modalFadeIn': 'modalFadeIn 0.3s ease-out',
            'modalSlideIn': 'modalSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1)',
            'pulse-custom': 'pulseCustom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'blink': 'blink 0.8s step-end infinite',
            'thinking': 'thinking 1.5s ease-in-out infinite',
            'countdownPulse': 'countdownPulse 1s ease-in-out infinite',
            'spin-slow': 'spin 5s linear infinite',
            'background-shift': 'backgroundShift 15s ease infinite',
            'ripple': 'ripple 1.2s ease-out infinite',
            'stagger-fade': 'staggerFade 0.6s ease forwards',
            'bounce-subtle': 'bounceSubtle 2s infinite'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }
    
    /* Animated background */
    .animated-background {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      background: linear-gradient(-45deg, #eeedfb, #f8f7ff, #eefbfa, #f0edfb);
      background-size: 400% 400%;
      animation: backgroundShift 15s ease infinite;
      opacity: 0.8;
    }
    
    .chat-box {
      max-height: 60vh;
      overflow-y: auto;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #9B8DE5 transparent;
    }
    
    .chat-box::-webkit-scrollbar {
      width: 6px;
    }
    
    .chat-box::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .chat-box::-webkit-scrollbar-thumb {
      background: #9B8DE5;
      border-radius: 3px;
    }
    
    /* Animation Keyframes */
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
    }
    
    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes messageSlide {
      from {
        opacity: 0;
        transform: translateX(-20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    
    @keyframes messageSlideRight {
      from {
        opacity: 0;
        transform: translateX(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    
    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    @keyframes pulseCustom {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }
    
    @keyframes blink {
      50% { border-color: transparent; }
    }
    
    @keyframes thinking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    
    @keyframes countdownPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    @keyframes backgroundShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes ripple {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }
    
    @keyframes staggerFade {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes bounceSubtle {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-8px);}
      60% {transform: translateY(-4px);}
    }
    
    .gradient-lavender-teal {
      background: linear-gradient(135deg, #9B8DE5 0%, #4DB6AC 100%);
      background-size: 200% 200%;
    }
    
    .gradient-lavender-teal-hover {
      background: linear-gradient(135deg, #8B7BD5 0%, #3DA69C 100%);
      background-size: 200% 200%;
    }
    
    .backdrop-blur-glass {
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.95);
    }
    
    .particle {
      position: absolute;
      background: rgba(155, 141, 229, 0.15);
      border-radius: 50%;
      pointer-events: none;
    }
    
    .countdown-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: conic-gradient(#9B8DE5 0deg, #e5e7eb 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .typing-indicator {
      border-right: 2px solid #9B8DE5;
      animation: blink 0.8s step-end infinite;
    }
    
    /* Ripple effect for buttons */
    .ripple {
      position: relative;
      overflow: hidden;
    }
    
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      animation: ripple 0.6s linear;
    }
    
    /* Message animation delay for staggered effect */
    .message-item {
      opacity: 0;
      animation: staggerFade 0.6s ease forwards;
    }
    
    /* Responsive animations */
    @media (max-width: 768px) {
      @keyframes messageSlide {
        from {
          opacity: 0;
          transform: translateX(-10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
      
      @keyframes messageSlideRight {
        from {
          opacity: 0;
          transform: translateX(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }
    }
  </style>
</head>
<body class="bg-background min-h-screen font-poppins">
  <!-- Animated Background -->
  <div class="animated-background"></div>
  
  <!-- Floating Particles Background -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div id="particles" class="w-full h-full relative"></div>
  </div>

  <div class="min-h-screen flex items-center justify-center p-4 relative z-10">
    <div class="w-full max-w-2xl backdrop-blur-glass border border-white/20 rounded-3xl shadow-2xl overflow-hidden animate-slideUp">
      
      <!-- Header -->
      <div class="gradient-lavender-teal p-6 text-white relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-primary to-secondary opacity-90 animate-gradient"></div>
        <div class="relative z-10">
          <h1 class="text-3xl font-bold font-merriweather flex items-center gap-3">
            <span class="animate-bounce-subtle text-4xl">💙</span> 
            <span>Chat with Luna</span>
            <span class="text-lg font-normal font-nunito opacity-80 ml-auto hidden sm:block">PCOS Support</span>
          </h1>
          <p class="text-sm opacity-90 mt-2 font-nunito">Your caring mental health companion</p>
        </div>
        <div class="absolute -right-10 -top-10 w-32 h-32 rounded-full bg-white/10 animate-float"></div>
        <div class="absolute -left-5 -bottom-5 w-20 h-20 rounded-full bg-white/5 animate-float" style="animation-delay: 2s;"></div>
      </div>

      <!-- Chat messages -->
      <div id="chat-box" class="chat-box space-y-4 p-6 bg-gradient-to-br from-gray-50 to-white/50 min-h-[400px] flex flex-col"></div>

      <!-- Input -->
      <div class="p-6 bg-white border-t border-gray-100">
        <form id="chat-form" class="flex gap-3">
          <div class="flex-grow relative">
            <input 
              id="message" 
              type="text" 
              placeholder="Share what's on your mind..." 
              class="w-full p-4 rounded-2xl border-2 border-gray-200 focus:border-primary focus:ring-4 focus:ring-primary/20 focus:outline-none transition-all duration-300 font-nunito bg-white shadow-sm hover:shadow-md hover:-translate-y-0.5"
              required
              autocomplete="off"
            >
            <div class="absolute inset-0 rounded-2xl bg-gradient-to-r from-primary/5 to-secondary/5 opacity-0 hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
          </div>
          <button 
            type="submit" 
            class="gradient-lavender-teal text-white px-6 py-4 rounded-2xl font-semibold font-nunito transition-all duration-300 hover:shadow-lg hover:-translate-y-1 active:scale-95 relative overflow-hidden group ripple"
          >
            <span class="relative z-10">
              <span class="hidden sm:inline">Send</span>
              <span class="sm:hidden text-xl">➤</span>
            </span>
            <div class="absolute inset-0 gradient-lavender-teal-hover opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Redirect Modal -->
  <div id="redirect-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 animate-modalFadeIn" style="display: none;">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center animate-modalSlideIn shadow-2xl border border-gray-100">
      <div class="text-4xl mb-4 animate-bounce-subtle" id="redirect-icon">🏠</div>
      <h3 class="text-2xl font-bold text-charcoal mb-2 font-merriweather" id="redirect-title">Redirecting to Home</h3>
      <p class="text-gray-600 mb-6 font-nunito" id="redirect-description">You'll be redirected in:</p>
      
      <div class="countdown-circle mx-auto mb-6 shadow-lg" id="countdown-circle">
        <div class="text-4xl font-bold text-primary animate-countdownPulse" id="countdown-number">5</div>
      </div>
      
      <button 
        class="bg-gradient-to-r from-red-400 to-red-500 hover:from-red-500 hover:to-red-600 text-white px-8 py-3 rounded-2xl font-semibold font-nunito transition-all duration-300 hover:shadow-lg hover:-translate-y-1 active:scale-95 ripple" 
        id="cancel-redirect"
      >
        Cancel Redirect
      </button>
    </div>
  </div>

  <script>
    // Initialize particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = window.innerWidth < 768 ? 10 : 20;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle animate-float';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.width = (Math.random() * 4 + 2) + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
        particlesContainer.appendChild(particle);
      }
    }

    // Add ripple effect to buttons
    function addRippleEffect(event) {
      const button = event.currentTarget;
      const circle = document.createElement("span");
      const diameter = Math.max(button.clientWidth, button.clientHeight);
      const radius = diameter / 2;
      
      circle.style.width = circle.style.height = `${diameter}px`;
      circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
      circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
      circle.classList.add("ripple-effect");
      
      const ripple = button.getElementsByClassName("ripple-effect")[0];
      if (ripple) ripple.remove();
      
      button.appendChild(circle);
    }
    
    // Add ripple effect to all buttons with ripple class
    const rippleButtons = document.querySelectorAll('.ripple');
    rippleButtons.forEach(button => {
      button.addEventListener('click', addRippleEffect);
    });

    // Chat functionality
    const chatBox = document.getElementById("chat-box");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message");
    const redirectModal = document.getElementById("redirect-modal");
    const countdownCircle = document.getElementById("countdown-circle");
    const countdownNumber = document.getElementById("countdown-number");
    const cancelButton = document.getElementById("cancel-redirect");
    const redirectTitle = document.getElementById("redirect-title");
    const redirectDescription = document.getElementById("redirect-description");
    const redirectIcon = document.getElementById("redirect-icon");

    let redirectTimeout;
    let countdownInterval;

    // Page icon and title mapping
    const pageConfig = {
      'home': { icon: '🏠', title: 'Home' },
      'profile': { icon: '👤', title: 'Profile' },
      'settings': { icon: '⚙️', title: 'Settings' },
      'dashboard': { icon: '📊', title: 'Dashboard' },
      'help': { icon: '❓', title: 'Help' },
      'about': { icon: 'ℹ️', title: 'About' },
      'contact': { icon: '📞', title: 'Contact' },
      'default': { icon: '🌐', title: 'Page' }
    };

    // Cancel redirect functionality
    cancelButton.addEventListener('click', () => {
      hideRedirectModal();
    });

    // Close modal when clicking outside
    redirectModal.addEventListener('click', (e) => {
      if (e.target === redirectModal) {
        hideRedirectModal();
      }
    });

    function getPageNameFromUrl(url) {
      try {
        const urlObj = new URL(url, window.location.origin);
        const pathname = urlObj.pathname.toLowerCase();
        const segments = pathname.split('/').filter(segment => segment);
        const lastSegment = segments[segments.length - 1] || 'home';
        return lastSegment.replace(/\.[^/.]+$/, ''); // Remove file extension
      } catch {
        return 'page';
      }
    }

    function showRedirectModal(targetUrl, delay = 5) {
      const pageName = getPageNameFromUrl(targetUrl);
      const config = pageConfig[pageName] || pageConfig['default'];
      
      // Update modal content
      redirectIcon.textContent = config.icon;
      redirectTitle.textContent = `Redirecting to ${config.title}`;
      redirectDescription.textContent = "You'll be redirected in:";
      
      redirectModal.style.display = 'flex';
      let timeLeft = delay;
      
      // Update countdown display
      const updateCountdown = () => {
        countdownNumber.textContent = timeLeft;
        const percentage = ((delay - timeLeft) / delay) * 360;
        countdownCircle.style.background = `conic-gradient(#9B8DE5 ${percentage}deg, #e5e7eb ${percentage}deg)`;
        
        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          window.location.href = targetUrl;
          return;
        }
        timeLeft--;
      };
      
      // Start countdown immediately
      updateCountdown();
      countdownInterval = setInterval(updateCountdown, 1000);
      
      // Set redirect timeout
      redirectTimeout = setTimeout(() => {
        window.location.href = targetUrl;
      }, delay * 1000);
    }

    function hideRedirectModal() {
      redirectModal.style.display = 'none';
      if (redirectTimeout) {
        clearTimeout(redirectTimeout);
        redirectTimeout = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      // Reset countdown display
      countdownNumber.textContent = '5';
      countdownCircle.style.background = 'conic-gradient(#9B8DE5 0deg, #e5e7eb 0deg)';
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userMessage = messageInput.value.trim();
      if (!userMessage) return;

      // Add user message with animation
      addMessage("You", userMessage, "user");

      // Clear input with smooth animation
      messageInput.value = "";
      messageInput.style.transform = "scale(0.98)";
      setTimeout(() => messageInput.style.transform = "scale(1)", 150);

      // Add Luna placeholder with thinking animation
      const lunaDiv = addMessage("Luna", "", "luna", true);

      try {
        const response = await fetch("/ask/", {
          method: "POST",
          body: new URLSearchParams({ message: userMessage }),
          headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });

        const contentType = response.headers.get("content-type");
        
        if (contentType && contentType.includes("application/json")) {
          // Handle JSON response (static commands)
          const data = await response.json();
          
          updateLunaMessage(lunaDiv, data.response || data.text || "Command executed");
          
          // Handle redirect command with modal
          if (data.action === "redirect" && data.target) {
            const delayMs = data.delay || 5;
            showRedirectModal(data.target, delayMs);
          }
          
        } else {
          // Handle streaming response (AI chat)
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let commandJson = null;
          let messageText = "";
          let isFirstChunk = true;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            if (isFirstChunk) {
              updateLunaMessage(lunaDiv, "");
              isFirstChunk = false;
            }
            
            buffer += decoder.decode(value, { stream: true });
            
            // Process the buffer to extract text and commands
            const lines = buffer.split('\n');
            buffer = lines.pop() || "";
            
            for (const line of lines) {
              if (line.includes("__COMMAND__START__")) {
                buffer = line;
              } else if (line.includes("__COMMAND__END__")) {
                const commandStart = buffer.indexOf("__COMMAND__START__");
                const commandEnd = line.indexOf("__COMMAND__END__");
                
                if (commandStart !== -1 && commandEnd !== -1) {
                  const jsonText = buffer.substring(commandStart + 17, buffer.length + commandEnd).trim();
                  try {
                    commandJson = JSON.parse(jsonText);
                  } catch (err) {
                    console.error("Failed to parse command JSON", err, jsonText);
                  }
                }
                buffer = line.substring(commandEnd + 15);
              } else {
                messageText += line;
                updateLunaMessage(lunaDiv, messageText);
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            }
          }

          // Final processing
          if (buffer && !buffer.includes("__COMMAND__")) {
            messageText += buffer;
            updateLunaMessage(lunaDiv, messageText);
          }

          // Perform redirect if command exists
          if (commandJson && commandJson.action === "redirect" && commandJson.target) {
            const delayMs = commandJson.delay || 5;
            showRedirectModal(commandJson.target, delayMs);
          }
        }

      } catch (err) {
        console.error("Error fetching Luna response:", err);
        updateLunaMessage(lunaDiv, "Sorry, I'm having trouble connecting right now. Please try again.", true);
      }
    });

    function addMessage(sender, text, type, isThinking = false) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message-item";
      
      // Add staggered animation delay based on message count
      const messageCount = chatBox.children.length;
      msgDiv.style.animationDelay = `${messageCount * 0.1}s`;
      
      if (type === "user") {
        msgDiv.innerHTML = `
          <div class="max-w-lg ml-auto animate-messageSlideRight">
            <div class="bg-gradient-to-r from-primary to-secondary text-white p-4 rounded-2xl rounded-tr-sm shadow-lg">
              <div class="font-semibold text-sm opacity-90 mb-1 font-nunito">${sender}</div>
              <div class="font-nunito">${text}</div>
            </div>
          </div>
        `;
      } else {
        const thinkingClass = isThinking ? "animate-thinking" : "";
        const thinkingText = isThinking ? '<span class="typing-indicator">Luna is thinking...</span>' : text;
        
        msgDiv.innerHTML = `
          <div class="max-w-lg animate-messageSlide">
            <div class="bg-white border border-gray-100 p-4 rounded-2xl rounded-tl-sm shadow-md hover:shadow-lg transition-all duration-300 hover:-translate-y-0.5 ${thinkingClass}">
              <div class="flex items-center gap-2 font-semibold text-sm text-gray-600 mb-1 font-nunito">
                <span class="text-lg">🤖</span> ${sender}
              </div>
              <div class="text-charcoal font-nunito" id="luna-text-${Date.now()}">${thinkingText}</div>
            </div>
          </div>
        `;
      }
      
      chatBox.appendChild(msgDiv);
      
      setTimeout(() => {
        chatBox.scrollTo({
          top: chatBox.scrollHeight,
          behavior: 'smooth'
        });
      }, 100);
      
      return msgDiv;
    }

    function updateLunaMessage(msgDiv, text, isError = false) {
      const textElement = msgDiv.querySelector('[id^="luna-text-"]');
      if (textElement) {
        textElement.innerHTML = text;
        textElement.classList.remove('typing-indicator');
        
        if (isError) {
          msgDiv.querySelector('.bg-white').classList.add('border-red-200', 'bg-red-50');
        }
      }
      msgDiv.classList.remove('animate-thinking');
    }

    // Initialize particles
    createParticles();

    // Add welcome message
    setTimeout(() => {
      addMessage("Luna", "Hi there! I'm Luna, your PCOS mental health companion. I'm here to listen and support you. How are you feeling today? 💜", "luna");
    }, 1000);

    // Responsive particle adjustment
    window.addEventListener('resize', () => {
      const particles = document.querySelectorAll('.particle');
      if (window.innerWidth < 768 && particles.length > 10) {
        for (let i = 10; i < particles.length; i++) {
          particles[i].remove();
        }
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && redirectModal.style.display === 'flex') {
        hideRedirectModal();
      }
    });
  </script>
</body>
</html>
